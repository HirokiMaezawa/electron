<!-- index.html（プロジェクトルート直下） -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Electron File Reader</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
    }
    .file-content {
      white-space: pre-wrap;
      border: 1px solid #ccc;
      padding: 8px;
      margin-top: 8px;
      max-height: 400px;
      overflow: auto;
    }

    .drop-zone {
      border: 2px dashed #888;
      border-radius: 4px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      width: 10%;
      margin-bottom: 8px;
      transition: border-color 0.2s;
      user-select: none;
    }

    .drop-zone:hover {
      border-color: #00aaff;
    }
  </style>
</head>
<body>
  <h1>ファイル編集</h1>

 <button id="open-file-btn">JSON配列を開く</button>
<button id="save-file-btn">保存</button>

<p>
  ファイル: <span id="file-path">(なし)</span><br />
  シーン <span id="scene-index">0</span> / <span id="scene-total">0</span>
</p>

<div>
  <label>テキスト1</label><br />
  <input id="text1" type="text" style="width: 50%" />
</div>
<div>
  <label>テキスト2</label><br />
  <input id="text2" type="text" style="width: 50%" />
</div>
<br>
<div>
  <label>next</label><br />
  <input id="next" type="number" />
</div>
<div>
  <label>背景</label><br />
<div id="background-drop" class="drop-zone">背景画像をドロップ</div>
<input id="backgroundName" placeholder="背景画像の名前を入力してね" type="text" />
</div>
<br>
<div>
  <label>キャラ名</label><br />
  <input id="characterName" type="text" style="width: 30%" />
</div>
<br>
<div>
  <label>キャラ画像</label><br />
  <div id="character-drop" class="drop-zone">キャラ画像をドロップ</div>
<input id="characterPicture" placeholder="キャラ画像の名前を入力してね" type="text" />
</div>
<br>
<div>
  <label><input id="showBackground" type="checkbox" checked /> 背景を表示(ONにすると、このシーンで背景表示されるよ)</label><br />
  <label><input id="showCharacter" type="checkbox" checked /> キャラを表示(ONにすると、このシーンでキャラ表示されるよ)</label><br />
  <label><input id="isTransitionToResult" type="checkbox" /> 結果画面へ遷移(ONにすると、結果画面に行くよ。最後のシーンで使ってね)</label>
</div>
<!-- <div>
  <label>eventPictureNum</label><br />
  <input id="eventPictureNum" type="number" />
</div> -->
<h3>選択肢</h3>
<div id="choices-container"></div>
<button id="add-choice-btn">選択肢を追加</button>

<button id="prev-scene-btn">&lt; 前の要素</button>
<button id="next-scene-btn">次の要素 &gt;</button>
<button id="addNextScene">次のシーンを追加する</button>



<script src="./dist/renderer.js"></script>
</body>
</html>
