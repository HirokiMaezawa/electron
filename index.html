<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>シナリオJSONエディタ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f3f5fb;
      color: #222;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0.05em;
    }

    .app-subtitle {
      margin: 0 0 24px;
      color: #666;
      font-size: 13px;
    }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 30, 70, 0.12);
      padding: 20px 24px 24px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.05s ease, box-shadow 0.05s ease, background-color 0.15s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .btn-ghost {
      background: #eef2ff;
      color: #1e293b;
    }

    .btn-ghost:hover {
      background: #e0e7ff;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .file-info {
      font-size: 12px;
      color: #555;
      margin-left: auto;
      text-align: right;
    }

    .file-info strong {
      font-weight: 600;
    }

    /* 3カラムレイアウト：左＝シーン一覧 / 中央＝内容 / 右＝選択肢 */
    .main-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 2fr) minmax(0, 1.4fr);
      gap: 24px;
      align-items: flex-start;
    }

    @media (max-width: 1100px) {
      .main-layout {
        grid-template-columns: 220px minmax(0, 2fr);
      }
      .choices-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 900px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* 汎用パネル */
    .panel {
      background: #f9fafb;
      border-radius: 10px;
      padding: 16px 18px 18px;
      border: 1px solid #e5e7eb;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .scene-counter {
      font-size: 12px;
      color: #6b7280;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
      display: inline-block;
    }

    .field-help {
      font-size: 11px;
      color: #6b7280;
      margin-left: 4px;
      font-weight: normal;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35);
    }

    .inline-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (min-width: 720px) {
      .inline-inputs {
        flex-direction: row;
      }
    }

    .inline-inputs > div {
      flex: 1;
    }

    .drop-zone {
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      margin-bottom: 6px;
      transition: border-color 0.2s, background-color 0.2s;
      user-select: none;
      background: #f8fafc;
      padding: 4px 8px;
      text-align: center;
      font-size: 12px;
      white-space: pre-line;
    }

    .drop-zone:hover {
      border-color: #2563eb;
      background: #eef2ff;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      margin-top: 4px;
    }

    .checkbox-group label {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      color: #374151;
      line-height: 1.4;
    }

    .checkbox-group input {
      margin-top: 2px;
    }

    .scene-nav {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .scene-nav .btn {
      flex: 0 0 auto;
    }

    /* シーン一覧パネル（左） */
    .scene-list-panel {
      background: #f9fafb;
      border-radius: 10px;
      padding: 12px 10px;
      border: 1px solid #e5e7eb;
      max-height: 640px;
      overflow-y: auto;
    }

    .scene-list-panel .panel-title {
      margin-bottom: 8px;
    }

    .scene-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scene-list-item {
      display: flex;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      margin-bottom: 2px;
      cursor: pointer;
      font-size: 12px;
      align-items: center;
      transition: background-color 0.12s ease, box-shadow 0.12s ease;
    }

    .scene-list-item:hover {
      background: #e5edff;
    }

    .scene-list-item.active {
      background: #dbeafe;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.3);
    }

    /* 左の小サムネ（背景） */
    .scene-list-thumb {
      width: 56px;
      height: 40px;
      border-radius: 6px;
      background: #e5e7eb;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #6b7280;
    }

    /* サムネ上のキャラアイコン */
    .scene-list-thumb-char {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background-size: contain;
      background-position: center bottom;
      background-repeat: no-repeat;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    }

    .scene-list-main {
      flex: 1;
      min-width: 0;
    }

    .scene-list-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .scene-list-index {
      font-weight: 600;
      color: #4b5563;
    }

    .scene-list-flags {
      font-size: 10px;
      color: #9ca3af;
    }

    .scene-list-text {
      font-size: 11px;
      color: #374151;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* 右：選択肢エリア */
    .choices-panel {
      background: #f9fafb;
      border-radius: 10px;
      padding: 14px 16px 16px;
      border: 1px solid #e5e7eb;
    }

    .choice-item {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .choice-item label {
      font-size: 11px;
      color: #4b5563;
      display: block;
      margin-bottom: 4px;
    }

    .choice-item input[type="text"],
    .choice-item select {
      font-size: 12px;
      padding: 4px 6px;
    }

    .choice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 12px;
      color: #6b7280;
    }

    .choices-empty {
      font-size: 12px;
      color: #9ca3af;
      padding: 8px 4px;
    }

    .choices-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    /* next フィールドは UI から隠す（内部では値だけ持たせる） */
    #next-field-group {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>シナリオ JSON エディタ</h1>
    <p class="app-subtitle">ノベルゲーム用のシーンデータを、GUIで編集できるツールです。</p>

    <!-- 上部ツールバー -->
    <div class="toolbar">
      <button id="open-file-btn" class="btn btn-primary">JSON配列を開く</button>
      <button id="save-file-btn" class="btn btn-ghost">保存</button>
      <button id="preview-scene-btn" class="btn btn-ghost">プレビュー</button>

      <div class="file-info">
        ファイル: <strong><span id="file-path">(なし)</span></strong><br />
        シーン <span id="scene-index">0</span> / <span id="scene-total">0</span>
      </div>
    </div>

    <div class="main-layout">
      <!-- 左：シーン一覧 -->
      <div class="scene-list-panel">
        <div class="panel-title">
          <span>シーン一覧</span>
        </div>
        <div id="scene-list" class="scene-list"></div>
      </div>

      <!-- 中央：シーン編集 -->
      <div class="panel">
        <div class="panel-title">
          <span>シーン内容</span>
        </div>

        <div class="field-group">
          <span class="field-label">
            シナリオテキスト
            <span class="field-help">（2行まで）</span>
          </span>
          <div class="inline-inputs">
            <div>
              <input id="text1" type="text" placeholder="テキスト1を入力" />
            </div>
            <div>
              <input id="text2" type="text" placeholder="テキスト2を入力" />
            </div>
          </div>
        </div>

        <!-- next は内部用。UI からは非表示 -->
        <div class="field-group" id="next-field-group">
          <label class="field-label" for="next">
            next
            <span class="field-help">（次のシーン番号）</span>
          </label>
          <input id="next" type="number" />
        </div>

        <div class="field-group">
          <span class="field-label">背景画像</span>
          <div id="background-drop" class="drop-zone">
            ここに背景画像ファイルをドロップすると、<br />
            pictures/ファイル名（拡張子なし）が設定されます
          </div>
          <input id="backgroundName" type="text" placeholder="背景画像キー（例: pictures/bg_room）" />
        </div>

        <div class="field-group">
          <label class="field-label" for="characterName">キャラ名</label>
          <input id="characterName" type="text" placeholder="キャラクター名（例: ユウキ）" />
        </div>

        <div class="field-group">
          <span class="field-label">キャラ画像</span>
          <div id="character-drop" class="drop-zone">
            ここにキャラ画像ファイルをドロップすると、<br />
            pictures/ファイル名（拡張子なし）が設定されます
          </div>
          <input id="characterPicture" type="text" placeholder="キャラ画像キー（例: pictures/char_yuuki）" />
        </div>

        <div class="field-group">
          <span class="field-label">表示設定</span>
          <div class="checkbox-group">
            <label>
              <input id="showBackground" type="checkbox" checked />
              <span>背景を表示する（ONにすると、このシーンで背景が表示されます）</span>
            </label>
            <label>
              <input id="showCharacter" type="checkbox" checked />
              <span>キャラクターを表示する（ONにすると、このシーンでキャラが表示されます）</span>
            </label>
            <label>
              <input id="isTransitionToResult" type="checkbox" />
              <span>結果画面へ遷移（ONにすると、このシーンの後に結果画面へ移動します）</span>
            </label>
          </div>
        </div>

        <div class="scene-nav">
          <button id="prev-scene-btn" class="btn btn-ghost">&lt; 前のシーン</button>
          <button id="next-scene-btn" class="btn btn-ghost">次のシーン &gt;</button>
          <button id="addNextScene" class="btn btn-primary">次のシーンを追加</button>
          <button id="delete-scene-btn" class="btn btn-danger">このシーンを削除</button>
        </div>
      </div>
      <!-- 右：選択肢編集 -->
      <div class="choices-panel">
        <div class="panel-title">
          <span>選択肢（最後のシーンに追加してね）</span>
        </div>

        <div id="choices-container">
          <div class="choices-empty">このシーンには、まだ選択肢がありません。</div>
        </div>

        <div class="choices-toolbar">
          <button id="add-choice-btn" class="btn btn-primary">＋ 選択肢を追加</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./dist/renderer.js"></script>
</body>
</html>
