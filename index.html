<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>シナリオ JSON エディタ</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #e0f2fe 0, #f3f4f6 45%, #e5e7eb 100%);
      color: #0f172a;
    }

    /* ========================== サイドバー ========================== */
    .sidebar {
      width: 260px;
      background: #0b1120;
      border-right: 1px solid #1f2937;
      overflow-y: auto;
      padding: 12px;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #bfdbfe;
    }

    .scene-counter {
      font-size: 12px;
      color: #9ca3af;
    }

    #scene-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scene-list-item {
      border-radius: 10px;
      padding: 7px;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      gap: 8px;
      cursor: pointer;
      border: 1px solid rgba(55, 65, 81, 0.9);
      transition: 0.15s ease;
    }

    .scene-list-item:hover {
      background: rgba(30, 64, 175, 0.9);
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.5);
    }

    .scene-list-item.active {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-color: #22d3ee;
      box-shadow: 0 10px 22px rgba(59, 130, 246, 0.5);
    }

    .scene-list-thumb {
      width: 64px;
      height: 48px;
      border-radius: 6px;
      background: #111827;
      color: #e5e7eb;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1f2937;
      position: relative;
      overflow: hidden;
    }

    .scene-list-thumb-char {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      pointer-events: none;
    }

    .scene-list-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .scene-list-item-header {
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      color: #cbd5f5;
      margin-bottom: 2px;
    }

    .scene-list-index { font-weight: 600; }
    .scene-list-flags { font-size: 10px; opacity: 0.9; }

    .scene-list-text {
      font-size: 11px;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ========================== メインエリア ========================== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      background: rgba(15, 23, 42, 0.96);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #1f2937;
      align-items: center;
      color: #e5e7eb;
    }

    .toolbar-left { display: flex; gap: 8px; align-items: center; }

    .toolbar-right {
      margin-left: auto;
      font-size: 11px;
      color: #9ca3af;
      max-width: 55%;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* ========================== ボタン共通 ========================== */
    .btn {
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .btn-primary:active { transform: scale(0.97); }

    .btn-ghost {
      background: rgba(148, 163, 184, 0.12);
      color: #374151;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1);
    }

    .btn-ghost:hover {
      background: rgba(148, 163, 184, 0.22);
      transform: translateY(-2px);
    }

    .btn-ghost:active { transform: scale(0.97); }

    /* ===== ナビ周りのカラフルボタン ===== */
    .btn-nav-prev,
    .btn-nav-next {
      background: linear-gradient(135deg, #f9fafb, #e5e7eb);
      color: #111827;
      box-shadow: 0 8px 18px rgba(148, 163, 184, 0.45);
      border: 1px solid #d1d5db;
    }

    .btn-nav-prev:hover,
    .btn-nav-next:hover {
      background: linear-gradient(135deg, #ffffff, #e5e7eb);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(148, 163, 184, 0.6);
    }

    .btn-nav-prev:active,
    .btn-nav-next:active {
      transform: scale(0.97);
    }

    .btn-nav-add {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #ffffff;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.55);
    }

    .btn-nav-add:hover {
      filter: brightness(1.07);
      transform: translateY(-2px);
    }

    .btn-nav-add:active { transform: scale(0.97); }

    .btn-nav-delete {
      background: linear-gradient(135deg, #1f1f1f, #000000);
      color: #ffffff;
      border: 1px solid #000;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
    }

    .btn-nav-delete:hover {
      background: linear-gradient(135deg, #2a2a2a, #080808);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.55);
    }

    .btn-nav-delete:active {
      background: linear-gradient(135deg, #131313, #000000);
      transform: scale(0.97);
    }

    .btn-nav-preview {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(234, 88, 12, 0.55);
    }

    .btn-nav-preview:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .btn-nav-preview:active { transform: scale(0.97); }

    /* ========================== エディタ本体 ========================== */
    .editor-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .card-title { font-size: 14px; font-weight: 600; color: #111827; }
    .card-subtitle { font-size: 11px; color: #6b7280; }

    .card-body { display: flex; flex-direction: column; gap: 10px; }

    /* グリッドレイアウト（共通背景／シーン編集） */
    .scene-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.3fr);
      gap: 16px;
    }

    .scene-grid-half {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 入力系 */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.4);
      background: #ffffff;
    }

    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: 0.2s;
      white-space: pre-line;
      padding: 4px;
    }

    .drop-zone.small { height: 64px; }

    .drop-zone:hover {
      border-color: #60a5fa;
      background-color: #eff6ff;
    }

    .flags-row {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #374151;
      flex-wrap: wrap;
    }

    .flags-row label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-row {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* 選択肢 */
    .choice-item {
      padding: 8px;
      background: #f9fafb;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 8px;
    }

    .choice-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .btn-danger {
      border-radius: 999px;
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-danger:hover { background: #fecaca; }

    .choices-empty {
      font-size: 12px;
      color: #9ca3af;
      padding: 4px 2px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 999px; }
  </style>
</head>

<body>

  <!-- ========================== サイドバー ========================== -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="app-title">Scenario JSON Editor</div>
      <div class="scene-counter">
        Scene <span id="scene-index">0</span> / <span id="scene-total">0</span>
      </div>
    </div>

    <div id="scene-list"></div>
  </div>

  <!-- ========================== メイン ========================== -->
  <div class="main">

    <!-- ツールバー -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="open-file-btn" class="btn btn-primary">📂 JSONを開く</button>
        <button id="save-file-btn" class="btn btn-ghost">💾 保存</button>
      </div>

      <div class="toolbar-right">
        <span id="file-path">(なし)</span>
      </div>
    </div>

    <!-- ========================== エディタ ========================== -->
    <div class="editor-area">

      <!-- 共通背景設定 -->
      <section class="card">
        <div class="card-header">
          <div class="card-title">共通背景設定</div>
          <div class="card-subtitle">タイトル画面・結果画面の背景（全シーン共通）</div>
        </div>

        <div class="card-body scene-grid">
          <!-- タイトル背景 -->
          <div class="scene-grid-half">
            <div class="field-group">
              <span class="field-label">タイトル背景</span>
              <div id="title-bg-drop" class="drop-zone small">ここに画像をドロップ</div>
              <input id="titleBackgroundName" type="text" placeholder="例: pictures/title_bg" />
            </div>
          </div>

          <!-- 結果背景 -->
          <div class="scene-grid-half">
            <div class="field-group">
              <span class="field-label">結果背景</span>
              <div id="result-bg-drop" class="drop-zone small">ここに画像をドロップ</div>
              <input id="resultBackgroundName" type="text" placeholder="例: pictures/result_bg" />
            </div>
          </div>
        </div>
      </section>

      <!-- シーン編集 -->
      <section class="card">
        <div class="card-header">
          <div class="card-title">シーン編集</div>
          <div class="card-subtitle">テキスト／背景／キャラ画像の設定</div>
        </div>

        <div class="card-body scene-grid">

          <!-- 左カラム -->
          <div class="scene-grid-half">

            <div class="field-group">
              <label class="field-label">テキスト1</label>
              <input id="text1" type="text">
            </div>

            <div class="field-group">
              <label class="field-label">テキスト2</label>
              <input id="text2" type="text">
            </div>

            <div class="field-group" style="display:none;">
              <label class="field-label">next</label>
              <input id="next" type="number">
            </div>

            <div class="field-group">
              <div class="flags-row">
                <label><input id="showBackground" type="checkbox" checked> 背景を表示</label>
                <label><input id="showCharacter" type="checkbox" checked> キャラを表示</label>
                <label><input id="isTransitionToResult" type="checkbox"> 結果画面へ遷移</label>
              </div>
            </div>

            <!-- ナビボタン行（シーン編集の一番下） -->
            <div class="nav-row">
              <button id="prev-scene-btn" class="btn btn-nav-prev">← 前のシーン</button>
              <button id="next-scene-btn" class="btn btn-nav-next">次のシーン →</button>
              <button id="addNextScene" class="btn btn-nav-add">＋ シーン追加</button>
              <button id="delete-scene-btn" class="btn btn-nav-delete">削除</button>
              <button id="preview-scene-btn" class="btn btn-nav-preview">▶ プレビュー</button>
            </div>

          </div>

          <!-- 右カラム -->
          <div class="scene-grid-half">

            <div class="field-group">
              <span class="field-label">背景画像</span>
              <div id="background-drop" class="drop-zone">画像をドロップ</div>
              <input id="backgroundName" type="text" placeholder="例: pictures/bg_room">
            </div>

            <div class="field-group">
              <label class="field-label">キャラ名</label>
              <input id="characterName" type="text">
            </div>

            <div class="field-group">
              <span class="field-label">キャラ画像</span>
              <div id="character-drop" class="drop-zone">画像をドロップ</div>
              <input id="characterPicture" type="text" placeholder="例: pictures/char_heroine">
            </div>

          </div>
        </div>
      </section>

      <!-- 選択肢 -->
      <!-- <section class="card">
        <div class="card-header">
          <div class="card-title">選択肢</div>
          <div class="card-subtitle">最大2つまで追加できます</div>
        </div>

        <div class="card-body">
          <div id="choices-container"></div>
          <button id="add-choice-btn" class="btn btn-primary">＋ 選択肢追加</button>
        </div>
      </section> -->
      <section class="card">
  <div class="card-header">
    <div class="card-title">選択肢</div>
    <div class="card-subtitle">最大2つまで追加できます</div>
  </div>

  <div class="card-body">
    <div id="choices-container"></div>

    <div class="choices-actions">
      <button id="add-choice-btn" class="btn btn-primary">＋ 選択肢追加</button>
      <!-- ★追加：新しいシナリオJSON作成ボタン -->
      <!-- <button id="create-choice-json-btn" class="btn btn-ghost">
        ＋ 新しいシナリオ JSON
      </button> -->


    </div>
  </div>
</section>


    </div>
  </div>

  <script src="./dist/renderer.js"></script>
</body>
</html>
